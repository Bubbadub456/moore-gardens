<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moore Gardens — Upload</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #144223;
    color: #fdfcf5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 900;
    margin-bottom: 2rem;
    text-align: center;
  }
  h1 span { color: #e68e2c; }
  .upload-form {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .photo-pick {
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
  }
  .photo-pick:hover, .photo-pick.has-photo {
    border-color: #8db63a;
  }
  .photo-pick input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .photo-pick .label {
    font-size: 0.9rem;
    opacity: 0.5;
  }
  .photo-pick img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 10px;
    display: none;
  }
  .photo-pick.has-photo .label { display: none; }
  .photo-pick.has-photo img { display: block; margin: 0 auto; }

  input[type="text"] {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    color: #fdfcf5;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]::placeholder { color: rgba(255,255,255,0.3); }
  input[type="text"]:focus { border-color: #8db63a; }

  button {
    background: #e68e2c;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 1rem;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .status {
    text-align: center;
    font-size: 0.85rem;
    min-height: 1.5rem;
    margin-top: 0.5rem;
  }
  .status.success { color: #8db63a; }
  .status.error { color: #e68e2c; }
</style>
</head>
<body>

<h1>Moore Gardens<span>!</span> Upload</h1>

<div class="upload-form">
  <div class="photo-pick" id="photoPick">
    <input type="file" accept="image/*" capture="environment" id="photoInput">
    <div class="label">tap to take or choose a photo</div>
    <img id="photoPreview" alt="">
  </div>

  <input type="text" id="titleInput" placeholder="quick title...">

  <button id="uploadBtn" disabled>upload</button>

  <div class="status" id="status"></div>
</div>

<script>
  const SUPABASE_URL = 'https://wcrcccrgaiesafmmzqgx.supabase.co';
  const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjcmNjY3JnYWllc2FmbW16cWd4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDQ3OTUxMSwiZXhwIjoyMDkwMDU1NTExfQ.RuXKqDdspupi2tHSsEuJgYWTS4oUcgG2w36wS3Hg8to';

  const photoInput = document.getElementById('photoInput');
  const photoPick = document.getElementById('photoPick');
  const photoPreview = document.getElementById('photoPreview');
  const titleInput = document.getElementById('titleInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const status = document.getElementById('status');

  let selectedFile = null;

  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    selectedFile = file;
    const url = URL.createObjectURL(file);
    photoPreview.src = url;
    photoPick.classList.add('has-photo');
    uploadBtn.disabled = false;
  });

  // Resize image on client before upload
  function resizeImage(file, maxWidth) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(resolve, 'image/jpeg', 0.75);
      };
      img.src = URL.createObjectURL(file);
    });
  }

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    const title = titleInput.value.trim() || 'Untitled';
    uploadBtn.disabled = true;
    status.textContent = 'resizing...';
    status.className = 'status';

    try {
      // Resize
      const resized = await resizeImage(selectedFile, 1200);
      const filename = `${Date.now()}.jpg`;

      // Upload to storage
      status.textContent = 'uploading photo...';
      const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${filename}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SERVICE_KEY}`,
          'Content-Type': 'image/jpeg',
        },
        body: resized,
      });

      if (!uploadRes.ok) throw new Error('Photo upload failed');

      // Insert gallery row
      status.textContent = 'saving...';
      const photoUrl = `${SUPABASE_URL}/storage/v1/object/public/photos/${filename}`;
      const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/gallery`, {
        method: 'POST',
        headers: {
          'apikey': SERVICE_KEY,
          'Authorization': `Bearer ${SERVICE_KEY}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ title, photo_url: photoUrl }),
      });

      if (!insertRes.ok) throw new Error('Database save failed');

      status.textContent = 'live on mooregardens.farm!';
      status.className = 'status success';

      // Reset form
      selectedFile = null;
      photoPreview.src = '';
      photoPick.classList.remove('has-photo');
      titleInput.value = '';
      photoInput.value = '';

    } catch (err) {
      status.textContent = err.message;
      status.className = 'status error';
    }

    uploadBtn.disabled = false;
  });
</script>
</body>
</html>
