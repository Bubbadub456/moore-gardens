<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moore Gardens — Upload</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #144223;
    color: #fdfcf5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1.5rem 4rem;
  }
  h1 { font-size: 1.4rem; font-weight: 900; margin-bottom: 1.5rem; text-align: center; }
  h1 span { color: #e68e2c; }

  .pick-btn {
    background: rgba(255,255,255,0.08);
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 1.5rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
    width: 100%;
    max-width: 420px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.5);
    margin-bottom: 1.5rem;
  }
  .pick-btn:hover { border-color: #8db63a; }
  .pick-btn input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .cards { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1.2rem; }

  .photo-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    overflow: hidden;
  }
  .photo-card img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: block;
  }
  .card-fields {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .field-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.35;
  }
  input[type="text"], textarea {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 0.7rem 0.8rem;
    color: #fdfcf5;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: rgba(255,255,255,0.25); }
  input[type="text"]:focus, textarea:focus { border-color: #8db63a; }
  textarea { resize: none; height: 55px; }

  .tags-wrap { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .tag-chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    padding: 0.3rem 0.7rem;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .tag-chip:hover { border-color: rgba(255,255,255,0.25); }
  .tag-chip.selected { background: #8db63a; border-color: #8db63a; color: white; }

  .remove-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.3);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 0.3rem 0;
    font-family: 'Nunito', sans-serif;
    text-align: right;
    transition: color 0.15s;
  }
  .remove-btn:hover { color: #e68e2c; }

  .upload-btn {
    background: #e68e2c;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 1rem;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    width: 100%;
    max-width: 420px;
    margin-top: 0.5rem;
  }
  .upload-btn:hover { opacity: 0.9; }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status {
    text-align: center;
    font-size: 0.85rem;
    min-height: 1.5rem;
    margin-top: 0.5rem;
    max-width: 420px;
  }
  .status.success { color: #8db63a; }
  .status.error { color: #e68e2c; }

  .hidden { display: none; }

  .gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    margin-top: 3rem;
  }
  .gate input {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    color: #fdfcf5;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    outline: none;
    text-align: center;
    width: 200px;
    letter-spacing: 0.05em;
  }
  .gate input::placeholder { color: rgba(255,255,255,0.25); }
  .gate input:focus { border-color: #8db63a; }
  .gate .hint {
    font-size: 0.75rem;
    opacity: 0.3;
  }
  .gate .wrong {
    color: #e68e2c;
    font-size: 0.8rem;
    min-height: 1.2rem;
  }
</style>
</head>
<body>

<h1>Moore Gardens<span>!</span> Upload</h1>

<!-- Gate -->
<div class="gate" id="gate">
  <div class="hint">password</div>
  <input type="password" id="pinInput" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" autofocus>
  <div class="wrong" id="wrongMsg"></div>
</div>

<!-- Upload (hidden until authenticated) -->
<div id="uploadArea" class="hidden">

<div class="pick-btn" id="pickBtn">
  <input type="file" accept="image/*" multiple id="photoInput">
  tap to choose photos
</div>

<div class="cards" id="cards"></div>

<button class="upload-btn hidden" id="uploadBtn" disabled>upload all</button>
<div class="status" id="status"></div>

</div>

<script>
  // Gate
  document.getElementById('pinInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (e.target.value === 'sweet') {
        document.getElementById('gate').classList.add('hidden');
        document.getElementById('uploadArea').classList.remove('hidden');
      } else {
        document.getElementById('wrongMsg').textContent = 'nope';
        e.target.value = '';
      }
    }
  });

  const SUPABASE_URL = 'https://wcrcccrgaiesafmmzqgx.supabase.co';
  const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjcmNjY3JnYWllc2FmbW16cWd4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDQ3OTUxMSwiZXhwIjoyMDkwMDU1NTExfQ.RuXKqDdspupi2tHSsEuJgYWTS4oUcgG2w36wS3Hg8to';
  const TAG_OPTIONS = ['seedlings','propagation','setup','harvest','pollinators','garden life','bloom','soil'];

  const photoInput = document.getElementById('photoInput');
  const cardsEl = document.getElementById('cards');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusEl = document.getElementById('status');

  let photoCards = [];

  photoInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    files.forEach(file => {
      const id = Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      const card = { id, file, tags: [] };
      photoCards.push(card);
      renderCard(card);
    });

    uploadBtn.classList.remove('hidden');
    checkAllReady();
  });

  function renderCard(card) {
    const el = document.createElement('div');
    el.className = 'photo-card';
    el.id = `card-${card.id}`;

    const tagsHtml = TAG_OPTIONS.map(t =>
      `<div class="tag-chip" data-tag="${t}" data-card="${card.id}">${t}</div>`
    ).join('');

    el.innerHTML = `
      <img src="${URL.createObjectURL(card.file)}" alt="">
      <div class="card-fields">
        <div class="field-label">title</div>
        <input type="text" placeholder="what are we looking at?" data-field="title" data-card="${card.id}">
        <div class="field-label">tags</div>
        <div class="tags-wrap">${tagsHtml}</div>
        <div class="field-label">plant</div>
        <input type="text" placeholder="e.g. Wild Bergamot" data-field="plant" data-card="${card.id}">
        <div class="field-label">thought</div>
        <textarea placeholder="anything to note?" data-field="thought" data-card="${card.id}"></textarea>
        <button class="remove-btn" data-card="${card.id}">remove</button>
      </div>`;
    cardsEl.appendChild(el);
  }

  // Tag toggle
  cardsEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.tag-chip');
    if (chip) {
      chip.classList.toggle('selected');
      const cardId = chip.dataset.card;
      const tag = chip.dataset.tag;
      const card = photoCards.find(c => c.id === cardId);
      if (card) {
        if (card.tags.includes(tag)) card.tags = card.tags.filter(t => t !== tag);
        else card.tags.push(tag);
      }
      return;
    }

    const removeBtn = e.target.closest('.remove-btn');
    if (removeBtn) {
      const cardId = removeBtn.dataset.card;
      photoCards = photoCards.filter(c => c.id !== cardId);
      document.getElementById(`card-${cardId}`).remove();
      if (!photoCards.length) uploadBtn.classList.add('hidden');
      checkAllReady();
    }
  });

  // Check titles
  cardsEl.addEventListener('input', checkAllReady);
  function checkAllReady() {
    if (!photoCards.length) { uploadBtn.disabled = true; return; }
    const allTitled = photoCards.every(card => {
      const input = document.querySelector(`input[data-field="title"][data-card="${card.id}"]`);
      return input && input.value.trim();
    });
    uploadBtn.disabled = !allTitled;
  }

  function resizeImage(file, maxWidth) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(resolve, 'image/jpeg', 0.75);
      };
      img.src = URL.createObjectURL(file);
    });
  }

  uploadBtn.addEventListener('click', async () => {
    if (!photoCards.length) return;
    uploadBtn.disabled = true;
    statusEl.className = 'status';
    const total = photoCards.length;

    try {
      for (let i = 0; i < total; i++) {
        const card = photoCards[i];
        const title = document.querySelector(`input[data-field="title"][data-card="${card.id}"]`).value.trim();
        const plant = document.querySelector(`input[data-field="plant"][data-card="${card.id}"]`).value.trim() || null;
        const thought = document.querySelector(`textarea[data-field="thought"][data-card="${card.id}"]`).value.trim() || null;

        statusEl.textContent = total === 1 ? 'resizing...' : `resizing ${i + 1} of ${total}...`;
        const resized = await resizeImage(card.file, 1200);
        const filename = `${Date.now()}-${i}.jpg`;

        statusEl.textContent = total === 1 ? 'uploading...' : `uploading ${i + 1} of ${total}...`;
        const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${filename}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${SERVICE_KEY}`, 'Content-Type': 'image/jpeg' },
          body: resized,
        });
        if (!uploadRes.ok) throw new Error(`Photo ${i + 1} upload failed`);

        const photoUrl = `${SUPABASE_URL}/storage/v1/object/public/photos/${filename}`;
        const row = { title, photo_url: photoUrl };
        if (card.tags.length > 0) row.tags = card.tags;
        if (thought) row.thought_note = thought;

        const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/gallery`, {
          method: 'POST',
          headers: {
            'apikey': SERVICE_KEY,
            'Authorization': `Bearer ${SERVICE_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(row),
        });
        if (!insertRes.ok) throw new Error(`Save ${i + 1} failed`);
      }

      statusEl.textContent = total === 1 ? 'live on mooregardens.farm!' : `${total} photos live on mooregardens.farm!`;
      statusEl.className = 'status success';

      photoCards = [];
      cardsEl.innerHTML = '';
      photoInput.value = '';
      uploadBtn.classList.add('hidden');
      uploadBtn.disabled = true;

    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = 'status error';
      uploadBtn.disabled = false;
    }
  });
</script>
</body>
</html>
