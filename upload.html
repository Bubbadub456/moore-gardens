<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moore Gardens — Upload</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #144223;
    color: #fdfcf5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 2rem 4rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 900;
    margin-bottom: 2rem;
    text-align: center;
  }
  h1 span { color: #e68e2c; }
  .upload-form {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .photo-pick {
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
  }
  .photo-pick:hover, .photo-pick.has-photo {
    border-color: #8db63a;
  }
  .photo-pick input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .photo-pick .label {
    font-size: 0.9rem;
    opacity: 0.5;
  }
  .photo-pick img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 10px;
    display: none;
  }
  .photo-pick.has-photo .label { display: none; }
  .photo-pick.has-photo img { display: block; margin: 0 auto; }
  .photo-count {
    font-size: 0.8rem;
    color: #8db63a;
    font-weight: 700;
    margin-top: 0.5rem;
    display: none;
  }
  .photo-pick.has-photo .photo-count { display: block; }

  input[type="text"], textarea {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    color: #fdfcf5;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: rgba(255,255,255,0.3); }
  input[type="text"]:focus, textarea:focus { border-color: #8db63a; }
  textarea { resize: none; height: 70px; }

  .field-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.4;
    margin-bottom: -0.5rem;
  }

  .tags-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .tag-chip {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 100px;
    padding: 0.4rem 0.9rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .tag-chip:hover { border-color: rgba(255,255,255,0.3); }
  .tag-chip.selected {
    background: #8db63a;
    border-color: #8db63a;
    color: white;
  }

  button {
    background: #e68e2c;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 1rem;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 0.5rem;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .status {
    text-align: center;
    font-size: 0.85rem;
    min-height: 1.5rem;
    margin-top: 0.5rem;
  }
  .status.success { color: #8db63a; }
  .status.error { color: #e68e2c; }
</style>
</head>
<body>

<h1>Moore Gardens<span>!</span> Upload</h1>

<div class="upload-form">
  <div class="photo-pick" id="photoPick">
    <input type="file" accept="image/*" multiple id="photoInput">
    <div class="label">tap to choose photos</div>
    <img id="photoPreview" alt="">
    <div class="photo-count" id="photoCount"></div>
  </div>

  <div class="field-label">title</div>
  <input type="text" id="titleInput" placeholder="what are we looking at?">

  <div class="field-label">tags</div>
  <div class="tags-wrap" id="tagsWrap">
    <div class="tag-chip" data-tag="seedlings">seedlings</div>
    <div class="tag-chip" data-tag="propagation">propagation</div>
    <div class="tag-chip" data-tag="setup">setup</div>
    <div class="tag-chip" data-tag="harvest">harvest</div>
    <div class="tag-chip" data-tag="pollinators">pollinators</div>
    <div class="tag-chip" data-tag="garden life">garden life</div>
    <div class="tag-chip" data-tag="bloom">bloom</div>
    <div class="tag-chip" data-tag="soil">soil</div>
  </div>

  <div class="field-label">plant</div>
  <input type="text" id="plantInput" placeholder="e.g. Wild Bergamot">

  <div class="field-label">thought</div>
  <textarea id="thoughtInput" placeholder="anything to note?"></textarea>

  <button id="uploadBtn" disabled>upload</button>

  <div class="status" id="status"></div>
</div>

<script>
  const SUPABASE_URL = 'https://wcrcccrgaiesafmmzqgx.supabase.co';
  const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjcmNjY3JnYWllc2FmbW16cWd4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDQ3OTUxMSwiZXhwIjoyMDkwMDU1NTExfQ.RuXKqDdspupi2tHSsEuJgYWTS4oUcgG2w36wS3Hg8to';

  const photoInput = document.getElementById('photoInput');
  const photoPick = document.getElementById('photoPick');
  const photoPreview = document.getElementById('photoPreview');
  const titleInput = document.getElementById('titleInput');
  const plantInput = document.getElementById('plantInput');
  const thoughtInput = document.getElementById('thoughtInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const status = document.getElementById('status');

  let selectedFiles = [];
  let selectedTags = [];

  photoInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    selectedFiles = files;
    photoPreview.src = URL.createObjectURL(files[0]);
    photoPick.classList.add('has-photo');
    document.getElementById('photoCount').textContent = files.length === 1 ? '1 photo' : `${files.length} photos`;
    checkReady();
  });

  document.getElementById('tagsWrap').addEventListener('click', (e) => {
    const chip = e.target.closest('.tag-chip');
    if (!chip) return;
    chip.classList.toggle('selected');
    const tag = chip.dataset.tag;
    if (selectedTags.includes(tag)) {
      selectedTags = selectedTags.filter(t => t !== tag);
    } else {
      selectedTags.push(tag);
    }
  });

  titleInput.addEventListener('input', checkReady);
  function checkReady() {
    uploadBtn.disabled = !(selectedFiles.length && titleInput.value.trim());
  }

  function resizeImage(file, maxWidth) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(resolve, 'image/jpeg', 0.75);
      };
      img.src = URL.createObjectURL(file);
    });
  }

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFiles.length || !titleInput.value.trim()) return;

    const baseTitle = titleInput.value.trim();
    const plant = plantInput.value.trim() || null;
    const thought = thoughtInput.value.trim() || null;
    const total = selectedFiles.length;

    uploadBtn.disabled = true;
    status.className = 'status';

    try {
      for (let i = 0; i < total; i++) {
        const title = total === 1 ? baseTitle : `${baseTitle} (${i + 1})`;
        status.textContent = total === 1 ? 'resizing...' : `resizing ${i + 1} of ${total}...`;

        const resized = await resizeImage(selectedFiles[i], 1200);
        const filename = `${Date.now()}-${i}.jpg`;

        status.textContent = total === 1 ? 'uploading photo...' : `uploading ${i + 1} of ${total}...`;
        const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${filename}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${SERVICE_KEY}`,
            'Content-Type': 'image/jpeg',
          },
          body: resized,
        });
        if (!uploadRes.ok) throw new Error(`Photo ${i + 1} upload failed`);

        const photoUrl = `${SUPABASE_URL}/storage/v1/object/public/photos/${filename}`;
        const row = { title, photo_url: photoUrl };
        if (selectedTags.length > 0) row.tags = selectedTags;
        if (thought && i === 0) row.thought_note = thought;

        const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/gallery`, {
          method: 'POST',
          headers: {
            'apikey': SERVICE_KEY,
            'Authorization': `Bearer ${SERVICE_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(row),
        });
        if (!insertRes.ok) throw new Error(`Save ${i + 1} failed`);
      }

      status.textContent = total === 1 ? 'live on mooregardens.farm!' : `${total} photos live on mooregardens.farm!`;
      status.className = 'status success';

      selectedFiles = [];
      selectedTags = [];
      photoPreview.src = '';
      photoPick.classList.remove('has-photo');
      document.getElementById('photoCount').textContent = '';
      titleInput.value = '';
      plantInput.value = '';
      thoughtInput.value = '';
      photoInput.value = '';
      document.querySelectorAll('.tag-chip.selected').forEach(c => c.classList.remove('selected'));
      uploadBtn.disabled = true;

    } catch (err) {
      status.textContent = err.message;
      status.className = 'status error';
      uploadBtn.disabled = false;
    }
  });
</script>
</body>
</html>
